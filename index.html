<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Feed Puro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Mi Feed</h1>
        <div class="actions">
            <button id="theme-toggle">🌓</button>
        </div>
    </header>

    <nav class="categories-scroll">
        <button class="active">Resumen del Día</button>
        <button>Finanzas</button>
        <button>Tecnología</button>
        <button>Deportes</button>
        <button>Guardados 🔖</button>
    </nav>

    <main id="feed-container"></main>

    <!-- Ventana de Lectura (Muro Roto) -->
    <div id="reader-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal">✖ Cerrar</button>
            <h1 id="reader-title"></h1>
            <div id="reader-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
