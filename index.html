<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Feed Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">
            <h1>Nexus</h1>
            <span id="user-badge">⚡ Live Core</span>
        </div>
        <div class="actions">
            <button id="theme-toggle" title="Cambiar Tema">🌓</button>
            <button id="settings-btn" title="Configurar Categorías y Filtros">⚙️</button>
        </div>
    </header>

    <!-- Barra de Categorías Dinámica -->
    <nav id="categories-container" class="categories-scroll">
        <!-- Generadas por JS -->
    </nav>

    <main id="feed-container">
        <div class="loading-state">Sincronizando actualidad reciente...</div>
    </main>

    <!-- Modal de Lectura Inmersiva (Con scroll bloqueado al fondo) -->
    <div id="reader-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-card">
            <button id="close-modal" class="close-btn">← Volver al Feed</button>
            <div id="reader-hero-media"></div>
            <h2 id="reader-title"></h2>
            <div class="reader-meta-info"><span id="reader-source"></span> • <span id="reader-date"></span></div>
            <hr class="divider">
            <div id="reader-body"></div>
        </div>
    </div>

    <!-- Modal de Configuración y Categorías Modificables -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-card">
            <button id="close-settings" class="close-btn">✕ Cerrar</button>
            <h2>Personalización y Motor Anti-Ruido</h2>
            <p class="modal-subtitle">Modifica tus categorías o añade feeds RSS personalizados a tu gusto.</p>
            
            <div class="settings-group">
                <label>Tus Categorías (separadas por comas):</label>
                <input type="text" id="categories-input" placeholder="ej: Resumen del Día, Finanzas, Tecnología, Deportes">
            </div>

            <div class="settings-group">
                <label>Palabras clave vetadas (separadas por comas):</label>
                <input type="text" id="blocked-input" placeholder="ej: clickbait, rumor">
            </div>

            <button id="save-settings-btn" class="primary-btn">Guardar Cambios</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
