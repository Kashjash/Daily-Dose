<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Feed Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">
            <h1>Nexus</h1>
            <span id="user-badge">⚡ Pro Core</span>
        </div>
        <div class="actions">
            <button id="theme-toggle" title="Cambiar Tema">🌓</button>
            <button id="settings-btn" title="Configurar Categorías y Filtros">⚙️</button>
        </div>
    </header>

    <!-- Barra de Categorías Asegurada -->
    <nav id="categories-container" class="categories-scroll">
        <!-- Renderizado dinámico blindado -->
    </nav>

    <main id="feed-container">
        <div class="loading-state">Sincronizando actualidad reciente...</div>
    </main>

    <!-- Modal de Lectura Inmersiva (Con scroll interno estricto y sin mover el fondo) -->
    <div id="reader-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-window glass-card">
            <div class="modal-header-bar">
                <button id="close-modal" class="close-btn">← Volver al Feed</button>
            </div>
            <div class="modal-scroll-area">
                <div id="reader-hero-media"></div>
                <h2 id="reader-title"></h2>
                <div class="reader-meta-info">
                    <span id="reader-source"></span> • 
                    <span id="reader-date"></span> • 
                    <span id="reader-lang"></span> • 
                    <span id="reader-time"></span>
                </div>
                <hr class="divider">
                <div id="reader-body"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Configuración y Categorías Modificables -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-window glass-card">
            <div class="modal-header-bar">
                <button id="close-settings" class="close-btn">✕ Cerrar</button>
            </div>
            <div class="modal-scroll-area">
                <h2>Personalización del Sistema</h2>
                <p class="modal-subtitle">Modifica tus categorías o añade feeds RSS personalizados.</p>
                
                <div class="settings-group">
                    <label>Tus Categorías (separadas por comas):</label>
                    <input type="text" id="categories-input">
                </div>

                <div class="settings-group">
                    <label>Palabras clave vetadas (separadas por comas):</label>
                    <input type="text" id="blocked-input">
                </div>

                <button id="save-settings-btn" class="primary-btn">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
